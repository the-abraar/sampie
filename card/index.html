<!doctype html>
<!-- Palette and logo for this card: change data-theme / data-mark (see brand/tokens.css, brand/logos.svg). -->
<html lang="en" data-theme="ink" data-mark="helix">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helix Biology Card</title>
  <link rel="stylesheet" href="/brand/tokens.css">
  <link rel="stylesheet" href="/brand/components.css">
  <link rel="stylesheet" href="card.css">
  <script src="/brand/theme.js" defer></script>
</head>
<body>
  <div class="frame">
    <section class="side side--front" aria-label="Card front">
      <svg class="watermark" viewBox="0 0 100 100" aria-hidden="true"><use class="mark" href="/brand/logos.svg#mark-helix"/></svg>
      <div class="trim front">
        <div class="lockup">
          <svg class="lockup__mark" viewBox="0 0 100 100" aria-hidden="true"><use class="mark" href="/brand/logos.svg#mark-helix"/></svg>
          <div class="lockup__words">
            <span class="lockup__name">Helix</span>
            <span class="lockup__sub">Biology</span>
          </div>
        </div>
        <hr class="rule">
        <p class="tagline">For future doctors</p>
      </div>
    </section>
  </div>

  <div class="frame">
    <section class="side side--back" aria-label="Card back">
      <div class="trim back">
        <header class="who">
          <h1 class="name">Samiul Alam</h1>
          <p class="cred">MBBS (DU)</p>
          <p class="role">Founder, Helix Biology</p>
        </header>
        <svg class="corner-mark" viewBox="0 0 100 100" aria-hidden="true"><use class="mark" href="/brand/logos.svg#mark-helix"/></svg>
        <dl class="details">
          <dt>Call · WhatsApp</dt><dd>+880 1817-521110</dd>
          <dt>Web</dt><dd>helixbiology.sch.ac</dd>
          <dt>Visit</dt><dd>28/10 Tajmahal Road, Block-C<br>Mohammadpur, Dhaka-1207<br><span class="muted">Opp. Bangabandhu Primary School</span></dd>
        </dl>
        <svg class="qr" viewBox="0 0 1 1" role="img" aria-label="QR code: helixbiology.sch.ac"><use href="/brand/qr.svg#qr"/></svg>
      </div>
    </section>
  </div>
</body>
</html>
