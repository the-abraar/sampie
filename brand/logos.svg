<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Helix Biology marks. Colours come from the CSS tokens logo-fg, logo-detail and logo-bg (see tokens.css).
       Use: <svg viewBox="0 0 100 100"><use href="/brand/logos.svg#mark-helix"/></svg>
       Marks: mark-helix (default), mark-h (H monogram), mark-seal (circular seal), mark-none. -->

  <!-- Double helix. Strands swap over/under at each crossing; rungs sit behind. -->
  <symbol id="mark-helix" viewBox="24 6 52 88">
    <g fill="none" stroke-linecap="round">
      <path style="stroke:var(--logo-detail);stroke-width:var(--logo-detail-stroke)" d="M34.2 20H65.8M34.2 40H65.8M34.2 60H65.8M34.2 80H65.8"/>
      <path style="stroke:var(--logo-fg);stroke-width:var(--logo-stroke)" d="M30 10C30 30 70 30 70 50"/>
      <path style="stroke:var(--logo-bg);stroke-width:var(--logo-halo)" stroke-linecap="butt" d="M60.33 24.37C54.07 28.43 45.93 31.57 39.67 35.63"/>
      <path style="stroke:var(--logo-fg);stroke-width:var(--logo-stroke)" d="M70 10C70 30 30 30 30 50"/>
      <path style="stroke:var(--logo-fg);stroke-width:var(--logo-stroke)" d="M30 50C30 70 70 70 70 90"/>
      <path style="stroke:var(--logo-bg);stroke-width:var(--logo-halo)" stroke-linecap="butt" d="M60.33 64.37C54.07 68.43 45.93 71.57 39.67 75.63"/>
      <path style="stroke:var(--logo-fg);stroke-width:var(--logo-stroke)" d="M70 50C70 70 30 70 30 90"/>
    </g>
  </symbol>

  <!-- H monogram: two stems, crossbar twisted like a DNA turn. -->
  <symbol id="mark-h" viewBox="21 9 58 82">
    <g fill="none" stroke-linecap="round">
      <path style="stroke:var(--logo-fg);stroke-width:var(--logo-stroke)" d="M27 14V86M73 14V86"/>
      <path style="stroke:var(--logo-detail);stroke-width:calc(var(--logo-detail-stroke) * 1.5)" d="M27 36C50 36 50 64 73 64"/>
      <path style="stroke:var(--logo-bg);stroke-width:calc(var(--logo-halo) * 0.7)" stroke-linecap="butt" d="M45.04 55.73C48.52 52.11 51.48 47.89 54.96 44.27"/>
      <path style="stroke:var(--logo-detail);stroke-width:calc(var(--logo-detail-stroke) * 1.5)" d="M27 64C50 64 50 36 73 36"/>
    </g>
  </symbol>

  <!-- Seal: the helix inside a double ring. Good for avatars, stamps, favicons. -->
  <symbol id="mark-seal" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" fill="none" style="stroke:var(--logo-fg);stroke-width:2.5"/>
    <circle cx="50" cy="50" r="41" fill="none" style="stroke:var(--logo-detail);stroke-width:1"/>
    <use href="#mark-helix" x="32" y="20" width="36" height="60"/>
  </symbol>

  <!-- Wordmark only. -->
  <symbol id="mark-none" viewBox="0 0 1 1"/>
</svg>
