<!doctype html>
<html lang="en" data-theme="ink" data-mark="helix">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helix Biology · For future doctors</title>
  <meta name="description" content="Helix Biology: Biology coaching for classes 9–12 in Mohammadpur, Dhaka, by Samiul Alam, MBBS (DU). Website coming soon.">
  <link rel="stylesheet" href="/brand/tokens.css">
  <link rel="stylesheet" href="/brand/components.css">
  <script src="/brand/theme.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: var(--space-7) var(--space-4); font-family: var(--font-text); text-align: center; }
    main { width: 100%; display: flex; flex-direction: column; align-items: center; max-width: 28rem; }
    .lockup { margin: 0; font-size: clamp(2.25rem, 9vw, 3.25rem); }
    .rule { width: 3rem; border: 0; border-top: var(--stroke-hairline) solid var(--c-accent); margin: var(--space-5) 0 var(--space-4); }
    .tagline { font: italic var(--weight-regular) var(--text-xl)/1.2 var(--font-display); color: var(--c-on-primary-muted); margin: 0; }
    .meta { color: var(--c-on-primary-muted); font-size: var(--text-sm); margin: var(--space-5) 0 var(--space-6); line-height: var(--leading-body); }
    .chip { background: color-mix(in srgb, var(--c-accent) var(--alpha-subtle), transparent); color: var(--c-accent); }
    .actions { display: grid; gap: var(--space-3); width: 100%; max-width: 20rem; }
    .actions .btn { height: var(--btn-height-lg); }
    address { font-style: normal; color: var(--c-on-primary-muted); font-size: var(--text-sm); line-height: var(--leading-body); margin-top: var(--space-6); }
  </style>
</head>
<body class="on-primary">
  <main>
    <h1 class="lockup" aria-label="Helix Biology">
      <svg class="lockup__mark" viewBox="0 0 100 100" aria-hidden="true"><use class="mark" href="/brand/logos.svg#mark-helix"/></svg>
      <span class="lockup__words" aria-hidden="true"><span class="lockup__name">Helix</span><span class="lockup__sub">Biology</span></span>
    </h1>
    <hr class="rule">
    <p class="tagline">For future doctors</p>
    <p class="meta">Biology for classes 9–12 with Samiul Alam, MBBS (DU).<br>Our website is coming soon.</p>
    <div class="actions">
      <a class="btn btn--primary" href="https://wa.me/8801817521110">Message on WhatsApp</a>
      <a class="btn btn--secondary" href="tel:+8801817521110">Call +880 1817-521110</a>
    </div>
    <address>28/10 Tajmahal Road, Block-C, Mohammadpur, Dhaka-1207<br>Opp. Bangabandhu Primary School</address>
  </main>
</body>
</html>
